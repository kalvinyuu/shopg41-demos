<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Own Stack — shopG41</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem;
      line-height: 1.55;
    }
    header { border-bottom: 1px solid #8884; padding-bottom: 1rem; margin-bottom: 2rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.35rem; letter-spacing: -0.02em; }
    h2 { font-size: 1.05rem; margin: 0 0 0.4rem; }
    header p { margin: 0; color: #7778; }
    section { border: 1px solid #8883; border-radius: 12px; padding: 1.1rem 1.25rem; margin-bottom: 1.25rem; }
    section > p { margin-top: 0; }
    .meta { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; color: #7778; }
    form { display: flex; gap: 0.5rem; margin: 0.75rem 0; flex-wrap: wrap; }
    input, button { padding: 0.5rem 0.65rem; font-size: 0.95rem; border-radius: 8px; border: 1px solid #8886; background: transparent; color: inherit; }
    button { cursor: pointer; font-weight: 500; }
    button:disabled { opacity: 0.55; cursor: default; }
    ul.rows { list-style: none; padding: 0; margin: 0.5rem 0 0; }
    ul.rows li { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0; border-top: 1px solid #8882; }
    .tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: #7778; border: 1px solid #8884; border-radius: 999px; padding: 0.05rem 0.5rem; }
    .price { margin-left: auto; font-variant-numeric: tabular-nums; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.5rem; }
    th { text-align: left; font-weight: 600; color: #7778; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    th, td { padding: 0.35rem 0.5rem 0.35rem 0; border-bottom: 1px solid #8882; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
    .empty { color: #7778; font-style: italic; }
    .ok { color: #1a9a5c; }
    .bad { color: #c0392b; }
    .result { margin-top: 0.9rem; }
    .result p { margin: 0.25rem 0; }
    pre { background: #8881; padding: 0.6rem; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./frontend.tsx"></script>
</body>
</html>
